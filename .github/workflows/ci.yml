name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json no se versiona (identifica un proyecto Firebase real, ver README).
      # El plugin com.google.gms.google-services lo requiere para compilar; el .example trae
      # placeholders válidos que alcanzan para compilar y correr los tests (ninguno llama a
      # Firebase real: los repos se testean contra fakes en memoria de sus DAOs/APIs).
      - name: Use placeholder google-services.json
        run: cp app/google-services.json.example app/google-services.json

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7
